[project]
name = "agent-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.116",
  "httpx>=0.28",
  "langgraph>=0.6",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.4",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
