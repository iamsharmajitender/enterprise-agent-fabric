<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p0-title p0-desc">
      <title id="p0-title">Pattern 0 — pin, one synthesis, return</title>
      <desc id="p0-desc">Front Door starts the run. Runtime pins the route. Data Plane returns the prompt pack. Runtime makes one synthesis LLM call and returns.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="p0-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
        <marker id="p0-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
        <marker id="p0-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>
      <line x1="40" y1="64" x2="1040" y2="64" stroke="rgba(30,41,59,0.12)" stroke-width="1"/>
      <line x1="40" y1="384" x2="1040" y2="384" stroke="rgba(30,41,59,0.12)" stroke-width="1"/>
      <line x1="168" y1="64" x2="168" y2="384" stroke="rgba(30,41,59,0.12)" stroke-width="1"/>
      <line x1="40" y1="144" x2="1040" y2="144" stroke="rgba(30,41,59,0.08)" stroke-width="1"/>
      <line x1="40" y1="224" x2="1040" y2="224" stroke="rgba(30,41,59,0.08)" stroke-width="1"/>
      <line x1="40" y1="304" x2="1040" y2="304" stroke="rgba(30,41,59,0.08)" stroke-width="1"/>
      <text x="52" y="108" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">FRONT DOOR</text>
      <text x="52" y="188" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">RUNTIME</text>
      <text x="52" y="268" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">DATA PLANE</text>
      <text x="52" y="348" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LLM</text>
