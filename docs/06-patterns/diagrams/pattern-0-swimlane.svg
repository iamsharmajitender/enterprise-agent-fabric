      <rect x="984" y="220" width="56" height="12" rx="2" fill="#f8fafc"/>
      <text x="1012" y="230" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text>
