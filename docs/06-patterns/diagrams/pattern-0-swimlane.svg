      <text x="428" y="182" fill="#1e293b" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Pin</text>
      <text x="428" y="196" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">route + goal</text>
      <rect x="544" y="240" width="136" height="48" rx="6" fill="#f8fafc"/>
      <rect x="544" y="240" width="136" height="48" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
