      <text x="612" y="276" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">host only</text>
      <rect x="728" y="320" width="136" height="48" rx="6" fill="#f8fafc"/>
      <rect x="728" y="320" width="136" height="48" rx="6" fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="1"/>
      <text x="796" y="342" fill="#1e293b" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">One complete</text>
      <text x="796" y="356" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">synthesis</text>
      <rect x="912" y="80" width="136" height="48" rx="6" fill="#f8fafc"/>
      <rect x="912" y="80" width="136" height="48" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="980" y="102" fill="#1e293b" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Return</text>
      <text x="980" y="116" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">result + notes</text>
      <line x1="40" y1="416" x2="1040" y2="416" stroke="rgba(30,41,59,0.08)" stroke-width="0.8"/>
      <text x="40" y="432" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="40" y="444" width="14" height="10" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="60" y="452" fill="#64748b" font-size="8" font-family="'Geist', system-ui, sans-serif">Step</text>
      <rect x="132" y="444" width="14" height="10" rx="2" fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="1"/>
      <text x="152" y="452" fill="#64748b" font-size="8" font-family="'Geist', system-ui, sans-serif">LLM call</text>
      <line x1="268" y1="449" x2="296" y2="449" stroke="#64748b" stroke-width="1.2" marker-end="url(#p0-arrow)"/>
      <text x="304" y="452" fill="#64748b" font-size="8" font-family="'Geist', system-ui, sans-serif">Handoff</text>
      <line x1="404" y1="449" x2="432" y2="449" stroke="#2563eb" stroke-width="1.2" marker-end="url(#p0-arrow-link)"/>
      <text x="440" y="452" fill="#64748b" font-size="8" font-family="'Geist', system-ui, sans-serif">Catalogue GET</text>
      <line x1="560" y1="449" x2="588" y2="449" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#p0-arrow-accent)"/>
      <text x="596" y="452" fill="#64748b" font-size="8" font-family="'Geist', system-ui, sans-serif">The one LLM call</text>
    </svg>