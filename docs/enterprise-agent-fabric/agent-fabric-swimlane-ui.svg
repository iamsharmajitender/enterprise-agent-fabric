      <line x1="168" y1="72" x2="168" y2="472" stroke="rgba(30,41,59,0.12)" stroke-width="1"/>

      <text x="52" y="116" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="0.14em">CHAT UI</text>
      <text x="52" y="196" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="0.14em">NAFD</text>
      <text x="52" y="276" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="0.14em">NACP</text>
      <text x="52" y="356" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="0.14em">NAR</text>
      <text x="52" y="436" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="0.14em">IDP</text>

