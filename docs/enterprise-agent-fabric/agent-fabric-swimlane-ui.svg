      <text x="574" y="284" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">eligible · route</text>

      <rect x="668" y="168" width="132" height="48" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="734" y="190" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Freeze</text>
      <text x="734" y="204" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">catalog · pin</text>

      <rect x="828" y="328" width="132" height="48" rx="6" fill="rgba(249,115,22,0.08)" stroke="#f97316" stroke-width="1"/>
      <text x="894" y="350" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Start run</text>
      <text x="894" y="364" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">runs · run pin</text>

      <rect x="828" y="168" width="132" height="48" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="894" y="190" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Slim reply</text>
      <text x="894" y="204" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">accepted</text>

      <rect x="828" y="88" width="132" height="48" rx="6" fill="rgba(100,116,139,0.10)" stroke="#94a3b8" stroke-width="1"/>
      <text x="894" y="110" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">SSE / poll</text>
      <text x="894" y="124" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">result later</text>

