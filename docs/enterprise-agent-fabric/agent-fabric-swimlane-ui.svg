<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hir-ui-sw-title hir-ui-sw-desc">
      <title id="hir-ui-sw-title">UI happy-path turn</title>
      <desc id="hir-ui-sw-desc">IDP mints the user bearer the Chat UI sends on the turn. NAFD authenticates, asks the NACP to classify, freezes the route, and async-starts NAR. NAR asks the IDP to mint the agent token, then returns 202. The NAFD sends a slim accepted reply. The UI waits on SSE or poll.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600;700&amp;display=swap');</style>
        <marker id="hir-ui-sw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
        <marker id="hir-ui-sw-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f97316"/></marker>
        <marker id="hir-ui-sw-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>

