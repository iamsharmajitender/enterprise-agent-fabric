      <text x="536" y="548" fill="#64748b" font-size="8" font-family="'Inter', sans-serif">IDP mints token</text>
      <line x1="656" y1="545" x2="684" y2="545" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#hir-ui-sw-arrow)"/>
      <text x="692" y="548" fill="#64748b" font-size="8" font-family="'Inter', sans-serif">Decide / 202</text>
