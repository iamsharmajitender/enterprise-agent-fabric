      <rect x="848" y="394" width="36" height="12" rx="2" fill="#f8fafc"/>
      <text x="866" y="403" fill="#2563eb" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">MINT</text>

      <rect x="188" y="88" width="132" height="48" rx="6" fill="rgba(100,116,139,0.10)" stroke="#94a3b8" stroke-width="1"/>
      <text x="254" y="110" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">POST turn</text>
      <text x="254" y="124" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">message</text>

