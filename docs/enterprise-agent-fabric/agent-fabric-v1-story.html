<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Enterprise Agent Fabric story</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-ink:     #1e293b;
      --color-muted:   #64748b;
      --color-accent:  #f97316;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Executive story</p>
    <h1>From fragmented AI to one governed front door.</h1>
    <svg viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eaf-v1-story-title eaf-v1-story-desc">
      <title id="eaf-v1-story-title">The Enterprise Agent Fabric story</title>
      <desc id="eaf-v1-story-desc">Five beats from fragmented AI, through one enterprise experience and the Agent Fabric, to business outcomes and the detailed technical design.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600;700&amp;display=swap');</style>
        <marker id="eaf-v1-story-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
        <marker id="eaf-v1-story-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f97316"/></marker>
        <marker id="eaf-v1-story-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <line x1="240" y1="104" x2="280" y2="104" stroke="#64748b" stroke-width="1.2" marker-end="url(#eaf-v1-story-arrow)"/>
      <line x1="480" y1="104" x2="520" y2="104" stroke="#f97316" stroke-width="1.8" marker-end="url(#eaf-v1-story-arrow-accent)"/>
      <line x1="760" y1="104" x2="800" y2="104" stroke="#64748b" stroke-width="1.2" marker-end="url(#eaf-v1-story-arrow)"/>
      <line x1="1000" y1="104" x2="1040" y2="104" stroke="#64748b" stroke-width="1.2" marker-end="url(#eaf-v1-story-arrow)"/>

      <rect x="40" y="56" width="200" height="96" rx="20" fill="#f8fafc"/>
      <rect x="40" y="56" width="200" height="96" rx="20" fill="rgba(100,116,139,0.10)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="56" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(148,163,184,0.45)" stroke-width="0.8"/>
      <text x="70" y="73" fill="#94a3b8" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="140" y="108" fill="#1e293b" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Fragmented AI</text>
      <text x="140" y="128" fill="#64748b" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">many assistants</text>

      <rect x="280" y="56" width="200" height="96" rx="6" fill="#f8fafc"/>
      <rect x="280" y="56" width="200" height="96" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <rect x="296" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.40)" stroke-width="0.8"/>
      <text x="310" y="73" fill="rgba(30,41,59,0.80)" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="380" y="108" fill="#1e293b" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">One experience</text>
      <text x="380" y="128" fill="#64748b" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">one assistant</text>

      <rect x="520" y="56" width="240" height="96" rx="6" fill="#f8fafc"/>
      <rect x="520" y="56" width="240" height="96" rx="6" fill="rgba(249,115,22,0.08)" stroke="#f97316" stroke-width="1"/>
      <rect x="536" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(249,115,22,0.45)" stroke-width="0.8"/>
      <text x="550" y="73" fill="#f97316" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="640" y="108" fill="#1e293b" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Agent Fabric</text>
      <text x="640" y="128" fill="#64748b" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">specialised capabilities</text>

      <rect x="800" y="56" width="200" height="96" rx="6" fill="#f8fafc"/>
      <rect x="800" y="56" width="200" height="96" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <rect x="816" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.40)" stroke-width="0.8"/>
      <text x="830" y="73" fill="rgba(30,41,59,0.80)" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="900" y="108" fill="#1e293b" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Outcomes</text>
      <text x="900" y="128" fill="#64748b" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">scale · speed · control</text>

      <rect x="1040" y="56" width="200" height="96" rx="20" fill="#f8fafc"/>
      <rect x="1040" y="56" width="200" height="96" rx="20" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <rect x="1056" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.40)" stroke-width="0.8"/>
      <text x="1070" y="73" fill="rgba(30,41,59,0.80)" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
      <text x="1140" y="108" fill="#1e293b" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Technical design</text>
      <text x="1140" y="128" fill="#64748b" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">working architecture</text>

      <text x="640" y="188" fill="#1e293b" font-size="16" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">One front door. Many specialised capabilities.</text>

      <line x1="40" y1="216" x2="1240" y2="216" stroke="rgba(30,41,59,0.10)" stroke-width="0.8"/>
      <text x="40" y="240" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="256" width="24" height="14" rx="7" fill="rgba(100,116,139,0.10)" stroke="#94a3b8" stroke-width="1"/>
      <text x="72" y="266" fill="#64748b" font-size="8" font-family="'Inter', sans-serif">Challenge</text>
      <rect x="160" y="256" width="20" height="14" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="188" y="266" fill="#64748b" font-size="8" font-family="'Inter', sans-serif">Step</text>
      <rect x="236" y="256" width="20" height="14" rx="2" fill="rgba(249,115,22,0.08)" stroke="#f97316" stroke-width="1"/>
      <text x="264" y="266" fill="#64748b" font-size="8" font-family="'Inter', sans-serif">Fabric</text>
      <rect x="328" y="256" width="24" height="14" rx="7" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="360" y="266" fill="#64748b" font-size="8" font-family="'Inter', sans-serif">Start / end</text>
      <line x1="452" y1="263" x2="480" y2="263" stroke="#f97316" stroke-width="1.4" marker-end="url(#eaf-v1-story-arrow-accent)"/>
      <text x="488" y="266" fill="#64748b" font-size="8" font-family="'Inter', sans-serif">The operating foundation</text>
    </svg>
  </div>
</body>
</html>
