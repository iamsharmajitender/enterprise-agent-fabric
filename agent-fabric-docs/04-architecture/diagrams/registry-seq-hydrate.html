<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydrate the whole manifest at pin</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f8fafc; --color-ink: #1e293b; --color-muted: #64748b;
      --color-accent: #3b82f6; --font-sans: 'Inter', sans-serif;
      --font-serif: 'Instrument Serif', serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Capability Registry</p>
    <h1>Hydrate the whole manifest at pin</h1>
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="registry-seq-hydrate-title registry-seq-hydrate-desc">
      <title id="registry-seq-hydrate-title">Hydrate the whole manifest at pin</title>
      <desc id="registry-seq-hydrate-desc">After AFD start, NAR downloads the pinned tool manifest, GETs every id@version from the registry, writes schemas onto the run pin, then sends schemas only to the LLM. The loop does not call the registry.</desc>
      <defs>
        <marker id="registry-seq-hydrate-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
        <marker id="registry-seq-hydrate-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
        <marker id="registry-seq-hydrate-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
        <marker id="registry-seq-hydrate-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#64748b" stroke-width="1.2"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>
      <line x1="128" y1="136" x2="128" y2="400" stroke="rgba(30,41,59,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="352" y1="136" x2="352" y2="400" stroke="rgba(30,41,59,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="576" y1="136" x2="576" y2="400" stroke="rgba(30,41,59,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="136" x2="800" y2="400" stroke="rgba(30,41,59,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="348" y="176" width="8" height="184" fill="rgba(30,41,59,0.06)" stroke="#64748b" stroke-width="0.8"/>
      <rect x="572" y="248" width="8" height="48" fill="rgba(30,41,59,0.06)" stroke="#64748b" stroke-width="0.8"/>
      <line x1="128" y1="176" x2="352" y2="176" stroke="#2563eb" stroke-width="1.2" marker-end="url(#registry-seq-hydrate-arrow-link)"/>
      <path d="M 360,216 L 396,216 L 396,240 L 360,240" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#registry-seq-hydrate-arrow)"/>
      <line x1="352" y1="256" x2="576" y2="256" stroke="#64748b" stroke-width="1.2" marker-end="url(#registry-seq-hydrate-arrow)"/>
      <line x1="576" y1="288" x2="360" y2="288" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#registry-seq-hydrate-arrow)"/>
      <line x1="352" y1="344" x2="800" y2="344" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#registry-seq-hydrate-arrow-accent)"/>
      <rect x="176" y="160" width="80" height="12" rx="2" fill="#f8fafc"/>
      <text x="216" y="169" fill="#2563eb" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">START</text>
      <rect x="408" y="220" width="72" height="12" rx="2" fill="#f8fafc"/>
      <text x="444" y="229" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">MANIFEST</text>
      <rect x="416" y="240" width="72" height="12" rx="2" fill="#f8fafc"/>
      <text x="452" y="249" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">GET VER</text>
      <rect x="416" y="272" width="64" height="12" rx="2" fill="#f8fafc"/>
      <text x="448" y="281" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">SCHEMA</text>
      <rect x="520" y="328" width="80" height="12" rx="2" fill="#f8fafc"/>
      <text x="560" y="337" fill="#3b82f6" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">SCHEMAS ONLY</text>
      <rect x="56" y="72" width="144" height="56" rx="6" fill="#f8fafc"/>
      <rect x="56" y="72" width="144" height="56" rx="6" fill="rgba(100,116,139,0.10)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="64" y="78" width="28" height="12" rx="2" fill="transparent" stroke="#94a3b8" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="78" y="87" fill="#94a3b8" fill-opacity="0.8" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">AFD</text>
      <text x="128" y="108" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">AFD</text>
      <text x="128" y="124" fill="#64748b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">freeze</text>
      <rect x="280" y="72" width="144" height="56" rx="6" fill="#f8fafc"/>
      <rect x="280" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <rect x="288" y="78" width="28" height="12" rx="2" fill="transparent" stroke="#1e293b" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="302" y="87" fill="#1e293b" fill-opacity="0.8" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">NAR</text>
      <text x="352" y="108" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">NAR</text>
      <text x="352" y="124" fill="#64748b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">hydrate</text>
      <rect x="504" y="72" width="144" height="56" rx="6" fill="#f8fafc"/>
      <rect x="504" y="72" width="144" height="56" rx="6" fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="1"/>
      <rect x="512" y="78" width="28" height="12" rx="2" fill="transparent" stroke="#3b82f6" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="526" y="87" fill="#3b82f6" fill-opacity="0.8" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REG</text>
      <text x="576" y="108" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Registry</text>
      <text x="576" y="124" fill="#64748b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">this box</text>
      <rect x="728" y="72" width="144" height="56" rx="6" fill="#f8fafc"/>
      <rect x="728" y="72" width="144" height="56" rx="6" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.30)" stroke-width="1"/>
      <rect x="736" y="78" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.30)" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="750" y="87" fill="rgba(30,41,59,0.30)" fill-opacity="0.8" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="800" y="108" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">LLM</text>
      <text x="800" y="124" fill="#64748b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">schemas only</text>
      <line x1="40" y1="440" x2="920" y2="440" stroke="rgba(30,41,59,0.10)" stroke-width="0.8"/>
      <text x="40" y="460" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="476" width="14" height="10" rx="2" fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="1"/>
      <text x="60" y="485" fill="#64748b" font-size="8" font-family="'Inter', sans-serif">Registry</text>
      <rect x="140" y="476" width="14" height="10" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="160" y="485" fill="#64748b" font-size="8" font-family="'Inter', sans-serif">NAR</text>
    </svg>
  </div>
</body>
</html>
