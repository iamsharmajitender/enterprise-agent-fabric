    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --color-ink:     #1e293b;
      --color-muted:   #64748b;

      --font-serif:    'Instrument Serif', serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1500px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1500px; display: block; }
  </style>

    <h1>One fabric. One ingress. One control plane. Specialized agents underneath.</h1>

      <title id="hir-arch-title">Enterprise Agent Fabric</title>
      <desc id="hir-arch-desc">Identity and Security and Quality and Evals sit on the left. Events sits at the top. Agent Fabric Plane holds three stacked rows: Capability Registry, Control Plane, and Data Plane. Front Door spans the same width beneath. Runtime and Shared sit to the right at full column height. Chat/UI and API enter only through Agent Fabric Front Door. Front Door asks Agent Data Plane to classify, pins the frozen route/session, then starts Agent Fabric Runtime. Agent Fabric Runtime fetches the route row from Agent Data Plane and hydrates tool metadata from the Agent Fabric Capability Registry. Observability and Agent audit sit side by side at the bottom; both feed Dashboard. Dashboard feeds Responsible / Governed AI.</desc>
