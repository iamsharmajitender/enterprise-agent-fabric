      <title id="agent-fabric-executive-problem-title">Fragmented enterprise AI today</title>
      <desc id="agent-fabric-executive-problem-desc">Employees, customers, and partners each reach separate AI assistants. Every capability rebuilds authentication, audit, and operations independently.</desc>
      <defs>
        
