<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From fragmented AI to scale with control.</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #1e293b;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Executive story</p>
    <h1>From fragmented AI to scale with control.</h1>
    
    <svg viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="agent-fabric-v1-story-title agent-fabric-v1-story-desc">
      <title id="agent-fabric-v1-story-title">The Enterprise Agent Fabric executive story</title>
      <desc id="agent-fabric-v1-story-desc">Five beats from fragmented AI and enterprise risk, through one operating model and domain autonomy, to scale with control.</desc>
      <defs>
      <marker id="eaf-v1-story-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
      </marker>
      <marker id="eaf-v1-story-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
      </marker></defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>
      <line x1="240" y1="104" x2="280" y2="104" stroke="#64748b" stroke-width="1.2" marker-end="url(#eaf-v1-story-arrow)"/>
<line x1="480" y1="104" x2="520" y2="104" stroke="#f97316" stroke-width="1.8" marker-end="url(#eaf-v1-story-arrow-accent)"/>
<line x1="720" y1="104" x2="760" y2="104" stroke="#64748b" stroke-width="1.2" marker-end="url(#eaf-v1-story-arrow)"/>
<line x1="960" y1="104" x2="1000" y2="104" stroke="#64748b" stroke-width="1.2" marker-end="url(#eaf-v1-story-arrow)"/>

      
      <rect x="40" y="56" width="200" height="96" rx="20" fill="#f8fafc"/>
      <rect x="40" y="56" width="200" height="96" rx="20" fill="rgba(100,116,139,0.10)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="48" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.45)" stroke-width="0.8"/>
      <text x="62" y="73" fill="#94a3b8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="140" y="100" fill="#1e293b" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">AI is fragmenting</text>
      <text x="140" y="120" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">more capabilities</text>
      <rect x="280" y="56" width="200" height="96" rx="6" fill="#f8fafc"/>
      <rect x="280" y="56" width="200" height="96" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <rect x="288" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.45)" stroke-width="0.8"/>
      <text x="302" y="73" fill="#1e293b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="380" y="100" fill="#1e293b" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Enterprise risk</text>
      <text x="380" y="120" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">duplicated controls</text>
      <rect x="520" y="56" width="200" height="96" rx="6" fill="#f8fafc"/>

      <rect x="528" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(249,115,22,0.45)" stroke-width="0.8"/>
      <text x="542" y="73" fill="#f97316" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="620" y="100" fill="#1e293b" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">One operating model</text>
      <text x="620" y="120" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Agent Fabric</text>
      <rect x="760" y="56" width="200" height="96" rx="6" fill="#f8fafc"/>
      <rect x="760" y="56" width="200" height="96" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <rect x="768" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.45)" stroke-width="0.8"/>
      <text x="782" y="73" fill="#1e293b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="860" y="100" fill="#1e293b" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Domain autonomy</text>
      <text x="860" y="120" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">teams own outcomes</text>
      <rect x="1000" y="56" width="200" height="96" rx="20" fill="#f8fafc"/>
      <rect x="1000" y="56" width="200" height="96" rx="20" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <rect x="1008" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,41,59,0.45)" stroke-width="0.8"/>
      <text x="1022" y="73" fill="#1e293b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
      <text x="1100" y="100" fill="#1e293b" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Scale with control</text>
      <text x="1100" y="120" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">portfolio growth</text>
      <text x="640" y="188" fill="#1e293b" font-size="16" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">One front door. Many specialised capabilities. One control model.</text>
      <line x1="40" y1="216" x2="1240" y2="216" stroke="rgba(30,41,59,0.10)" stroke-width="0.8"/>
      <text x="40" y="240" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="256" width="24" height="14" rx="7" fill="rgba(100,116,139,0.10)" stroke="#94a3b8" stroke-width="1"/>
      <text x="72" y="266" fill="#64748b" font-size="8" font-family="'Geist', system-ui, sans-serif">Challenge</text>
      <rect x="236" y="256" width="20" height="14" rx="2" fill="rgba(249,115,22,0.10)" stroke="#f97316" stroke-width="1"/>
      <text x="264" y="266" fill="#64748b" font-size="8" font-family="'Geist', system-ui, sans-serif">Fabric focal</text>
      <rect x="360" y="256" width="20" height="14" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="388" y="266" fill="#64748b" font-size="8" font-family="'Geist', system-ui, sans-serif">Outcome</text>
    </svg>
  </div>

</html>
