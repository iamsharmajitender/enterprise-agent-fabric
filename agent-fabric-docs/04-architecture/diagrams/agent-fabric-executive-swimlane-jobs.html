<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claims system triggers AI: verify, route, execute, evidence alongside, outcome returned.</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #1e293b;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1080px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Automated work</p>
    <h1>Claims system triggers AI: verify, route, execute, evidence alongside, outcome returned.</h1>
    
    <svg viewBox="0 0 1080 440" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="agent-fabric-executive-swimlane-jobs-title agent-fabric-executive-swimlane-jobs-desc">
      <title id="agent-fabric-executive-swimlane-jobs-title">Automated AI request swimlane</title>
      <desc id="agent-fabric-executive-swimlane-jobs-desc">A claims system or batch job triggers AI through the Enterprise Fabric: verify and entitle, route and pin, execute under policy, record evidence alongside, return outcome.</desc>
      <defs>
      <marker id="exec-sw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
      </marker>
      <marker id="exec-sw-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
      </marker></defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- lane bands -->
      <rect x="148" y="44" width="900" height="76" fill="rgba(100,116,139,0.06)" rx="4"/>
      <rect x="148" y="132" width="900" height="92" fill="rgba(249,115,22,0.10)" rx="4"/>
      <rect x="148" y="236" width="900" height="76" fill="rgba(59,130,246,0.08)" rx="4"/>
      <rect x="148" y="328" width="900" height="76" fill="rgba(30,41,59,0.04)" rx="4"/>

      <!-- lane dividers -->
      <line x1="148" y1="44" x2="1048" y2="44" stroke="rgba(30,41,59,0.12)" stroke-width="1"/>
      <line x1="148" y1="128" x2="1048" y2="128" stroke="rgba(30,41,59,0.08)" stroke-width="1"/>
      <line x1="148" y1="224" x2="1048" y2="224" stroke="rgba(30,41,59,0.08)" stroke-width="1"/>
      <line x1="148" y1="328" x2="1048" y2="328" stroke="rgba(30,41,59,0.08)" stroke-width="1"/>
      <line x1="148" y1="404" x2="1048" y2="404" stroke="rgba(30,41,59,0.12)" stroke-width="1"/>
      <line x1="148" y1="44" x2="148" y2="404" stroke="rgba(30,41,59,0.12)" stroke-width="1"/>

      <!-- lane labels -->
      <text x="24" y="88" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">APPLICATION</text>
      <text x="24" y="98" fill="#1e293b" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif">Claims system</text>
      <text x="24" y="110" fill="#64748b" font-size="8" font-family="'Geist', system-ui, sans-serif">or batch job</text>

      <text x="24" y="176" fill="#f97316" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">ENTERPRISE</text>
      <text x="24" y="188" fill="#1e293b" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif">Agent Fabric</text>

      <text x="24" y="272" fill="#3b82f6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">DOMAIN</text>
      <text x="24" y="284" fill="#1e293b" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif">Claims AI</text>

      <text x="24" y="360" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">ALONGSIDE</text>
      <text x="24" y="372" fill="#1e293b" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif">Audit &amp; ops</text>

      <!-- steps -->
      
      <rect x="164" y="60" width="112" height="44" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="220" y="82" fill="#1e293b" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Trigger job</text>
      <text x="220" y="92" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">route case</text>
      
      <rect x="336" y="148" width="128" height="52" rx="6" fill="rgba(249,115,22,0.10)" stroke="#f97316" stroke-width="1"/>
      <text x="400" y="170" fill="#1e293b" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Verify</text>
      <text x="400" y="188" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">identity &amp; entitle</text>
      
      <rect x="516" y="148" width="128" height="52" rx="6" fill="rgba(249,115,22,0.10)" stroke="#f97316" stroke-width="1"/>
      <text x="580" y="170" fill="#1e293b" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Route &amp; pin</text>
      <text x="580" y="188" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">select capability</text>
      
      <rect x="696" y="248" width="128" height="52" rx="6" fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="1"/>
      <text x="760" y="270" fill="#1e293b" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Execute</text>
      <text x="760" y="288" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">under policy</text>
      
      <rect x="884" y="60" width="112" height="44" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="940" y="82" fill="#1e293b" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Outcome</text>
      <text x="940" y="92" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">202 / result</text>
      
      <rect x="352" y="344" width="96" height="40" rx="6" fill="rgba(30,41,59,0.02)" stroke="#64748b" stroke-width="1"/>
      <text x="400" y="368" fill="#1e293b" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Record</text>
      
      
      <rect x="532" y="344" width="96" height="40" rx="6" fill="rgba(30,41,59,0.02)" stroke="#64748b" stroke-width="1"/>
      <text x="580" y="368" fill="#1e293b" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Record</text>
      
      
      <rect x="712" y="344" width="96" height="40" rx="6" fill="rgba(30,41,59,0.02)" stroke="#64748b" stroke-width="1"/>
      <text x="760" y="368" fill="#1e293b" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Record</text>
      
      
      <rect x="892" y="344" width="96" height="40" rx="6" fill="rgba(30,41,59,0.02)" stroke="#64748b" stroke-width="1"/>
      <text x="940" y="368" fill="#1e293b" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Record</text>
      

      <!-- optional control callout -->
      <rect x="740" y="196" width="88" height="22" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="784" y="211" fill="#64748b" font-size="8" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">approval if required</text>

      <!-- flow arrows -->
      <line x1="276" y1="82" x2="336" y2="148" stroke="#64748b" stroke-width="1.3" marker-end="url(#exec-sw-arrow)"/>
      <line x1="464" y1="174" x2="516" y2="174" stroke="#f97316" stroke-width="1.5" marker-end="url(#exec-sw-arrow-accent)"/>
      <line x1="644" y1="174" x2="696" y2="248" stroke="#64748b" stroke-width="1.3" marker-end="url(#exec-sw-arrow)"/>
      <line x1="824" y1="274" x2="884" y2="82" stroke="#64748b" stroke-width="1.3" marker-end="url(#exec-sw-arrow)"/>

      <!-- alongside track -->
      <line x1="400" y1="364" x2="940" y2="364" stroke="#64748b" stroke-width="1" stroke-dasharray="5 4" opacity="0.7"/>
      <text x="1040" y="358" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">runs alongside — does not block unless approval required</text>

      <!-- column headers -->
      <text x="220" y="28" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">START</text>
      <text x="400" y="28" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">VERIFY</text>
      <text x="580" y="28" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">ROUTE</text>
      <text x="760" y="28" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">EXECUTE</text>
      <text x="940" y="28" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">COMPLETE</text>

      <text x="540" y="428" fill="#1e293b" font-size="13" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">Same governed path for chat and automated jobs — verify → route → execute → evidence → outcome</text>
    </svg>
  </div>
</body>
</html>
