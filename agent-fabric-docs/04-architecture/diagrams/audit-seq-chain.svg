<?xml version="1.0" encoding="UTF-8"?>
    <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="audit-seq-chain-title audit-seq-chain-desc">
      <title id="audit-seq-chain-title">Phase A evidence chain</title>
      <desc id="audit-seq-chain-desc">ADP, AFD, and AR emit audit events asynchronously to AADP. Decide and start do not wait. AACP queries the chain by correlation_id for ops examination.</desc>
      <defs>
        <marker id="audit-seq-chain-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
        <marker id="audit-seq-chain-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>
      <line x1="96" y1="136" x2="96" y2="520" stroke="rgba(30,41,59,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="256" y1="136" x2="256" y2="520" stroke="rgba(30,41,59,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="416" y1="136" x2="416" y2="520" stroke="rgba(30,41,59,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="576" y1="136" x2="576" y2="520" stroke="rgba(30,41,59,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="736" y1="136" x2="736" y2="520" stroke="rgba(30,41,59,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="896" y1="136" x2="896" y2="520" stroke="rgba(30,41,59,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="412" y="176" width="8" height="320" fill="rgba(59,130,246,0.06)" stroke="#3b82f6" stroke-width="0.8"/>
      <line x1="256" y1="176" x2="416" y2="176" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#audit-seq-chain-arrow)"/>
      <line x1="96" y1="232" x2="416" y2="232" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#audit-seq-chain-arrow)"/>
      <line x1="576" y1="288" x2="416" y2="288" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#audit-seq-chain-arrow)"/>
      <line x1="576" y1="344" x2="416" y2="344" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#audit-seq-chain-arrow)"/>
      <line x1="576" y1="400" x2="416" y2="400" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#audit-seq-chain-arrow)"/>
      <line x1="896" y1="456" x2="416" y2="456" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#audit-seq-chain-arrow-accent)"/>
      <rect x="300" y="160" width="72" height="12" rx="2" fill="#f8fafc"/>
      <text x="336" y="169" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">DECIDE.*</text>
      <rect x="140" y="216" width="64" height="12" rx="2" fill="#f8fafc"/>
      <text x="172" y="225" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">FREEZE</text>
      <rect x="440" y="272" width="72" height="12" rx="2" fill="#f8fafc"/>
      <text x="476" y="281" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">HYDRATE</text>
      <rect x="440" y="328" width="56" height="12" rx="2" fill="#f8fafc"/>
      <text x="468" y="337" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">STAGE.*</text>
      <rect x="440" y="384" width="64" height="12" rx="2" fill="#f8fafc"/>
      <text x="472" y="393" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">TERMINAL</text>
      <rect x="640" y="440" width="88" height="12" rx="2" fill="#f8fafc"/>
      <text x="684" y="449" fill="#3b82f6" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">GET CHAIN</text>
