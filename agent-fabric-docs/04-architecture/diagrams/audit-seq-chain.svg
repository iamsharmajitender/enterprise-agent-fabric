      <text x="96" y="108" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">AFD</text>
      <rect x="184" y="72" width="144" height="56" rx="6" fill="rgba(100,116,139,0.10)" stroke="#94a3b8" stroke-width="1"/>
      <text x="256" y="108" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">ADP</text>
      <rect x="344" y="72" width="144" height="56" rx="6" fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="1"/>
      <text x="416" y="108" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">AADP</text>
      <rect x="504" y="72" width="144" height="56" rx="6" fill="rgba(100,116,139,0.10)" stroke="#94a3b8" stroke-width="1"/>
      <text x="576" y="108" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">AR</text>
      <rect x="664" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="736" y="108" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">User</text>
      <rect x="824" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="896" y="108" fill="#1e293b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">AACP</text>
      <line x1="40" y1="560" x2="920" y2="560" stroke="rgba(30,41,59,0.10)" stroke-width="0.8"/>
      <text x="40" y="580" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="0.18em">NOTE</text>
      <text x="40" y="600" fill="#64748b" font-size="9" font-family="'Inter', sans-serif">Dashed arrows are async POST — decide / freeze / start never await audit commit.</text>
    </svg>
