      <title id="runtime-seq-start-title">Start, hydrate, 202, then loop</title>
      <desc id="runtime-seq-start-desc">AFD posts the freeze. Agent runtime reads the pinned catalogue row, hydrates every capability, mints the agent token, returns 202, then runs. The loop is not on the decide clock.</desc>
