<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="afd-seq-ui-title afd-seq-ui-desc">
      <title id="afd-seq-ui-title">UI turn: classify, freeze, start</title>
      <desc id="afd-seq-ui-desc">User posts a turn. Chat AFD asks the Data Plane to classify, then async-starts Agent runtime and returns a slim accepted reply. The result arrives later on SSE or poll.</desc>
