<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="autonomy-who-picks-title autonomy-who-picks-desc">
  <title id="autonomy-who-picks-title">Who picks the next step</title>
  <desc id="autonomy-who-picks-desc">Four autonomy modes. Mode 0 nobody. Mode 1 the model inside a budget. Mode 2 the designer. Mode 3 the designer outside and a named allowlist inside.</desc>
  <rect width="100%" height="100%" fill="#f8fafc"/>

  <text x="36" y="200" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em" transform="rotate(-90 36 200)">WHO PICKS</text>

  <rect x="80" y="40" width="840" height="256" rx="8" fill="none" stroke="#1e293b" stroke-width="1"/>

  <rect x="80" y="40" width="840" height="64" fill="#ffffff"/>
  <text x="104" y="64" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">0</text>
  <text x="160" y="68" fill="#1e293b" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Single inference</text>
  <text x="880" y="68" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">nobody  one model call</text>
  <line x1="80" y1="104" x2="920" y2="104" stroke="rgba(30,41,59,0.12)" stroke-width="1"/>

  <rect x="80" y="104" width="840" height="64" fill="rgba(249,115,22,0.10)"/>
  <rect x="80" y="104" width="840" height="64" fill="none" stroke="#f97316" stroke-width="1"/>
  <text x="104" y="128" fill="#f97316" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">1</text>
  <text x="160" y="132" fill="#1e293b" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Autonomous</text>
  <text x="880" y="132" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">the model  inside a budget</text>
  <line x1="80" y1="168" x2="920" y2="168" stroke="rgba(30,41,59,0.12)" stroke-width="1"/>

  <rect x="80" y="168" width="840" height="64" fill="#ffffff"/>
  <text x="104" y="192" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">2</text>
  <text x="160" y="196" fill="#1e293b" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Deterministic</text>
  <text x="880" y="196" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">the designer  fixed stages</text>
  <line x1="80" y1="232" x2="920" y2="232" stroke="rgba(30,41,59,0.12)" stroke-width="1"/>

  <rect x="80" y="232" width="840" height="64" fill="#f8fafc"/>
  <text x="104" y="256" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">3</text>
  <text x="160" y="260" fill="#1e293b" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Guided</text>
  <text x="880" y="260" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">designer outside, allowlist inside</text>

  <line x1="40" y1="336" x2="960" y2="336" stroke="rgba(30,41,59,0.10)" stroke-width="0.8"/>
  <text x="40" y="360" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="136" y="352" width="16" height="12" rx="2" fill="rgba(249,115,22,0.10)" stroke="#f97316" stroke-width="1"/>
  <text x="160" y="362" fill="#64748b" font-size="8" font-family="'Geist', system-ui, sans-serif">Highest latitude  the path is not known in advance</text>
</svg>
