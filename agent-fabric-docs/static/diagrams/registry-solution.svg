      <title id="registry-solution-title">Publish. Refer. Hydrate once.</title>
      <desc id="registry-solution-desc">Publishers append an immutable id@version. Agent developers refer from the tool manifest. Agent runtime hydrates the whole pinned manifest before the LLM. Invoke goes through Shared PEP: domain APIs or API AFD jobs.</desc>
