    <h1>One fabric. One ingress. One control plane. Specialized agents underneath.</h1>
    <svg viewBox="0 0 1280 948" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
      <title id="arch-title">Enterprise Agent Fabric</title>
      <desc id="arch-desc">High-level architecture. Identity and Security and Quality and Evals run as bands down the left. Events sits at the top. Chat/UI and API enter only through the Agent Front Door. Inside the Agent Plane the Agent Control Plane sits on top, with the Agent Data Plane and the Agent Capability Plane side by side beneath it over one Postgres store. The Front Door asks the Data Plane to classify, freezes the route, then starts the Agent Runtime asynchronously. The Runtime fetches the pinned route row from the Data Plane, hydrates tool metadata from the Agent Capability Plane, and calls Shared services for Memory, RAG, Model and Tools. Observability and Agent audit sit side by side at the bottom; both feed Dashboard, which feeds Responsible / Governed AI.</desc>
