<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hir-req-title hir-req-desc">
      <title id="hir-req-title">Request path after decide</title>
      <desc id="hir-req-desc">NAFD is one block. NACP and route catalog are a separate block. Agent runtime is a third. NAFD asks the NACP to classify. On route the NAFD stores the frozen route and async-starts Agent runtime. Agent runtime copies the run pin and returns 202 to the NAFD.</desc>
