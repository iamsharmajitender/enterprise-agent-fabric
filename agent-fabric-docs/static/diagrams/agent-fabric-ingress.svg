<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hir-ing-title hir-ing-desc">
      <title id="hir-ing-title">Two ingress shapes</title>
      <desc id="hir-ing-desc">Chat hits the Chat NAFD. The jobs API and Kafka job start hit the API NAFD. NAFDs ask the NACP to classify. On route the NAFD stores the frozen route and async-starts Agent runtime. NACP and Agent runtime are separate boxes. Kafka runs_topic is return, not a third NAFD. The NACP does not start Agent runtime.</desc>
