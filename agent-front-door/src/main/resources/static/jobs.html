<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front Door jobs scratchpad</title>
<style>
  :root { color-scheme: light; font: 16px/1.45 ui-sans-serif, system-ui, sans-serif; }
  body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 1.125rem; margin: 0 0 0.25rem; }
  .muted { color: #555; font-size: 0.875rem; margin: 0 0 1rem; }
  nav { font-size: 0.875rem; margin: 0 0 1rem; }
  nav a { color: #1a1a1a; }
  #log {
    height: 22rem;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    scrollbar-color: #888 #eee;
    border: 1px solid #ccc;
    background: #fff;
    padding: 0.75rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #log::-webkit-scrollbar { width: 0.75rem; }
  #log::-webkit-scrollbar-track { background: #eee; }
  #log::-webkit-scrollbar-thumb { background: #888; border: 2px solid #eee; }
  form { display: grid; gap: 0.5rem; margin-top: 0.75rem; }
  .row { display: flex; gap: 0.5rem; }
  label { font-size: 0.75rem; color: #555; }
  input, button { font: inherit; padding: 0.5rem 0.75rem; }
  input { flex: 1; }
  button { justify-self: start; }
  button:focus-visible, input:focus-visible, a:focus-visible, #log:focus-visible { outline: 2px solid #1a1a1a; outline-offset: 2px; }
</style>
<nav><a href="/chat.html">Chat</a> · Jobs</nav>
<h1>Jobs scratchpad</h1>
<p class="muted">Same-origin posts to this Front Door. Not a product. Stub user jane. Starts <code>POST /v1/jobs</code> then polls <code>GET /v1/jobs/{correlation_id}</code>.</p>
<div id="log" role="log" aria-live="polite" aria-label="Job log" tabindex="0"></div>
<form id="f">
  <div>
    <label for="route">route_id</label>
    <div class="row">
      <input id="route" name="route_id" autocomplete="off" value="fee_explain">
    </div>
  </div>
  <div>
    <label for="payload">payload</label>
    <div class="row">
      <input id="payload" name="payload" autocomplete="off" value='{"account_id":"acc-42"}'>
    </div>
  </div>
  <button type="submit">Start job</button>
</form>
<script>
const headers = {
  Authorization: "Bearer stub",
  "Content-Type": "application/json",
  "X-Stub-Claims": '{"sub":"jane","emts":{"accounts:read":true,"claims:read":true}}',
};
const logEl = document.getElementById("log");
const log = (line) => {
  logEl.textContent += line + "\n";
  logEl.scrollTop = logEl.scrollHeight;
};
async function api(path, opt = {}) {
  const res = await fetch(path, { headers, ...opt });
  const text = await res.text();
  let body; try { body = JSON.parse(text); } catch { body = { raw: text }; }
  if (!res.ok) throw new Error(res.status + " " + text);
  return body;
}
async function poll(id) {
  for (let i = 0; i < 40; i++) {
    const ev = await api("/v1/jobs/" + encodeURIComponent(id));
    const msg = ev.message || ev.result?.message;
    if (ev.status === "completed" || msg) { log("result: " + (msg || JSON.stringify(ev))); return; }
    await new Promise((r) => setTimeout(r, 250));
  }
  log("(poll timeout)");
}
document.getElementById("f").addEventListener("submit", async (event) => {
  event.preventDefault();
  const routeId = document.getElementById("route").value.trim();
  if (!routeId) return;
  let payload = {};
  const raw = document.getElementById("payload").value.trim();
  if (raw) {
    try { payload = JSON.parse(raw); }
    catch (err) { log("error: payload is not JSON"); return; }
  }
  const idempotencyKey = "job-" + routeId + ":" + crypto.randomUUID();
  log("start: " + routeId + " key=" + idempotencyKey);
  try {
    const accepted = await api("/v1/jobs", {
      method: "POST",
      body: JSON.stringify({ route_id: routeId, idempotency_key: idempotencyKey, payload }),
    });
    const id = accepted.correlation_id;
    log("accepted: " + id);
    await poll(id);
  } catch (err) { log("error: " + err.message); }
});
</script>
