server.port: 3012

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:agent-audit-data-plane}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/audit}
    username: ${SPRING_DATASOURCE_USERNAME:fabric}
    password: ${SPRING_DATASOURCE_PASSWORD:fabric}
    hikari:
      pool-name: audit-pool
      maximum-pool-size: 10
  flyway:
    enabled: true

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: ${MANAGEMENT_OTLP_METRICS_EXPORT_STEP:1s}
  metrics:
    tags:
      application: ${spring.application.name}
