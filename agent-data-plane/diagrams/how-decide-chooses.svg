<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adp-decide-title adp-decide-desc">
      <title id="adp-decide-title">How decide actually chooses</title>
      <desc id="adp-decide-desc">Front Door posts decide. Jobs with a route id entitle against all active rows. Chat builds an eligible set, then either binds a named id or scores whole-token keywords. Outcomes are route, clarify, or abstain. Jobs never clarify. Non-AFD callers are rejected before this tree.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;display=swap');</style>
      
        <marker id="adp-decide-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
        <marker id="adp-decide-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- Connectors -->
      <line x1="480" y1="64" x2="480" y2="80" stroke="#64748b" stroke-width="1.2" marker-end="url(#adp-decide-arrow)"/>
      <line x1="580" y1="128" x2="660" y2="128" stroke="#64748b" stroke-width="1.2" marker-end="url(#adp-decide-arrow)"/>
      <line x1="480" y1="176" x2="480" y2="192" stroke="#64748b" stroke-width="1.2" marker-end="url(#adp-decide-arrow)"/>
      <path d="M 860,128 H 880 V 488 H 160 V 512" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#adp-decide-arrow)"/>
      <path d="M 760,176 V 448 H 480 V 512" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#adp-decide-arrow)"/>
      <line x1="580" y1="240" x2="640" y2="240" stroke="#64748b" stroke-width="1.2"/>
      <path d="M 640,240 V 468 H 520 V 512" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#adp-decide-arrow)"/>
      <line x1="480" y1="288" x2="480" y2="304" stroke="#64748b" stroke-width="1.2" marker-end="url(#adp-decide-arrow)"/>
      <path d="M 480,400 V 472 H 120 V 512" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#adp-decide-arrow)"/>
      <path d="M 380,352 H 320 V 536 H 400" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#adp-decide-arrow)"/>
      <path d="M 580,352 H 800 V 512" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#adp-decide-arrow)"/>

      <!-- Branch labels -->
      <rect x="604" y="112" width="32" height="12" rx="2" fill="#f8fafc"/>
      <text x="620" y="121" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
      <rect x="488" y="176" width="28" height="12" rx="2" fill="#f8fafc"/>
      <text x="502" y="185" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
      <rect x="868" y="108" width="32" height="12" rx="2" fill="#f8fafc"/>
      <text x="884" y="117" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
      <rect x="772" y="248" width="24" height="12" rx="2" fill="#f8fafc"/>
      <text x="784" y="257" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
      <rect x="588" y="216" width="44" height="12" rx="2" fill="#f8fafc"/>
      <text x="610" y="225" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">EMPTY</text>
      <rect x="488" y="288" width="36" height="12" rx="2" fill="#f8fafc"/>
      <text x="506" y="297" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">SOME</text>
      <rect x="488" y="424" width="16" height="12" rx="2" fill="#f8fafc"/>
      <text x="496" y="433" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">1</text>
      <rect x="328" y="340" width="16" height="12" rx="2" fill="#f8fafc"/>
      <text x="336" y="349" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">0</text>
      <rect x="640" y="336" width="24" height="12" rx="2" fill="#f8fafc"/>
      <text x="652" y="345" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">2+</text>

      <!-- Start -->
      <rect x="400" y="16" width="160" height="48" rx="24" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.30)" stroke-width="1"/>
      <text x="480" y="36" fill="#1e293b" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">POST decide</text>
      <text x="480" y="52" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">X-Workload: afd</text>

      <!-- Diamond: jobs? -->
      <polygon points="480,80 580,128 480,176 380,128" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="480" y="124" fill="#1e293b" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Jobs + route_id?</text>
      <text x="480" y="140" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">all active rows</text>

      <!-- Diamond: entitled? -->
      <polygon points="760,80 860,128 760,176 660,128" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="760" y="124" fill="#1e293b" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Entitled?</text>
      <text x="760" y="140" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">claims ⊇ required</text>

      <!-- Diamond: eligible empty? -->
      <polygon points="480,192 580,240 480,288 380,240" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="480" y="236" fill="#1e293b" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Eligible empty?</text>
      <text x="480" y="252" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">visible ∩ channel ∩ claims</text>

      <!-- Diamond: unique keyword? -->
      <polygon points="480,304 580,352 480,400 380,352" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="480" y="348" fill="#1e293b" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Unique keyword?</text>
      <text x="480" y="364" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">whole token · 0.91</text>

      <!-- Ends -->
      <rect x="80" y="512" width="160" height="48" rx="24" fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="1"/>
      <text x="160" y="532" fill="#1e293b" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">route</text>
      <text x="160" y="548" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">AFD starts Runtime</text>

      <rect x="400" y="512" width="160" height="48" rx="24" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.30)" stroke-width="1"/>
      <text x="480" y="532" fill="#1e293b" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">abstain</text>
      <text x="480" y="548" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">fail closed</text>

      <rect x="720" y="512" width="160" height="48" rx="24" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.30)" stroke-width="1"/>
      <text x="800" y="532" fill="#1e293b" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">clarify</text>
      <text x="800" y="548" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">chat only · top 2</text>

      <!-- Callout -->
      <text x="928" y="64" fill="#1e293b" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">jobs never clarify</text>
      <path d="M 860,72 Q 820,72 760,80" fill="none" stroke="rgba(30,41,59,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="760" cy="80" r="2" fill="#1e293b"/>

      <!-- Legend -->
      <line x1="32" y1="572" x2="928" y2="572" stroke="rgba(30,41,59,0.10)" stroke-width="0.8"/>
      <text x="32" y="588" fill="#64748b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
      <rect x="280" y="580" width="24" height="12" rx="6" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.30)" stroke-width="1"/>
      <text x="312" y="590" fill="#64748b" font-size="8" font-family="Inter, sans-serif">Start / end</text>
      <polygon points="400,586 412,580 424,586 412,592" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="432" y="590" fill="#64748b" font-size="8" font-family="Inter, sans-serif">Decision</text>
      <rect x="512" y="580" width="24" height="12" rx="6" fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="1"/>
      <text x="544" y="590" fill="#64748b" font-size="8" font-family="Inter, sans-serif">route</text>
      <line x1="612" y1="586" x2="640" y2="586" stroke="#64748b" stroke-width="1.2" marker-end="url(#adp-decide-arrow)"/>
      <text x="648" y="590" fill="#64748b" font-size="8" font-family="Inter, sans-serif">other branch</text>
    </svg>
