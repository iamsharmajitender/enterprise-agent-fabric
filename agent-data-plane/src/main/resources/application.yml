fabric:
  decide:
    llm:
      enabled: ${FABRIC_DECIDE_LLM_ENABLED:false}
      timeout-ms: ${FABRIC_DECIDE_LLM_TIMEOUT_MS:500}
  audit-data-plane-url: ${AUDIT_DATA_PLANE_URL:}

server.port: 3007

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:agent-data-plane}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/adp}
    username: ${SPRING_DATASOURCE_USERNAME:fabric}
    password: ${SPRING_DATASOURCE_PASSWORD:fabric}
    hikari:
      pool-name: adp-pool
      maximum-pool-size: 10
      register-mbeans: true
  flyway:
    enabled: true

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: ${MANAGEMENT_OTLP_METRICS_EXPORT_STEP:1s}
    logging:
      endpoint: ${MANAGEMENT_OTLP_LOGGING_ENDPOINT:http://localhost:4318/v1/logs}
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      hikaricp: true
      jdbc: true
